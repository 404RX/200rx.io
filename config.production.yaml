baseURL: "https://200rx.com"
languageCode: "en-us"
title: "Ray Miller - IT Infrastructure Specialist"
theme: "toha"

# Production-specific parameters
params:
  # Production environment
  environment: "production"
  showEnvironmentBadge: false
  
  # Production API endpoints
  crmApiUrl: "https://200rxio-crm-production.up.railway.app"
  aiApiUrl: "https://portfolio-ai-backend-1zyj.onrender.com"
  
  # Development analytics (disable or use test IDs)
  analytics:
    google:
      id: "" # Disable in dev or use GA4-DEV-ID
    
  # Development contact form
  contact:
    testMode: true
    
# Development build settings
build:
  writeStats: true
  
# Development markup settings  
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    noClasses: false
    
# Enable production features
enableRobotsTXT: true # Enable robots.txt in production
enableGitInfo: true
enableEmoji: true

# Development menu structure
menu:
  main:
    - name: "🚧 DEV ENVIRONMENT"
      url: "#"
      weight: 1

# Pagination
pagination:
  pagerSize: 10
  path: "page"

# Taxonomies
taxonomies:
  tag: "tags"
  category: "categories"
  series: "series"

# Related content
related:
  threshold: 80
  includeNewer: true
  toLower: false
  indices:
    - name: "tags"
      weight: 100
    - name: "categories"
      weight: 200